{% extends 'survey/base.html' %}

{% block title %}Submit Survey{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-8">

        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h3 class="mb-0">Technology Survey Form</h3>
            </div>

            <div class="card-body">

                <p>Please complete the survey below.</p>

                <form method="POST">
                    {% csrf_token %}

                    {{ form.as_p }}

                    <button type="submit" class="btn btn-primary">
                        Submit Survey
                    </button>
                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
